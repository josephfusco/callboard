[default.extend-words]
# Intentional spellings go here, one per line, as `word = "word"`.
# HTMLMediaElement fires a `seeked` event; it is not a misspelling of "sought".
seeked = "seeked"

[files]
extend-exclude = [
  # Generated by release-please; commit SHAs read as misspellings.
  "CHANGELOG.md",
  # Lockfiles and fixtures are not prose.
  "package-lock.json",
  "composer.lock",
  "tests/fixtures/",
  ".wordpress-org/",
]
