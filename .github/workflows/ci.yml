name: CI

on:
  push:
    branches: [ main ]
  # Unfiltered: `branches: [ main ]` would skip pull requests against another base.
  pull_request:
  # wp-env runs against current WordPress core, so a weekly run catches a core
  # release or a drifting dependency even when nothing has been pushed.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # release-please's own pushes to its branch carry nothing the suite can
  # judge; the release workflow dispatches a full run onto that branch once
  # the version strings are synced, and that dispatch is what gates the
  # release pull request.
  gate:
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || (!startsWith(github.head_ref, 'release-please--') && !startsWith(github.ref, 'refs/heads/release-please--')) }}
    steps:
      - run: true

  # Docs-only changes skip the wp-env jobs. `workflow_call` jobs cannot carry
  # `paths:` themselves, so the filter runs as its own job and gates the rest.
  changes:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code || steps.everything.outputs.code }}
    steps:
      # A scheduled or manual run has no diff to filter; run the whole suite.
      - id: everything
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: echo "code=true" >> "$GITHUB_OUTPUT"
      # Full history so the filter can diff against the previous push without
      # fetching, which it cannot do once the checkout drops its credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.everything.outcome == 'skipped'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: steps.everything.outcome == 'skipped'
        id: filter
        with:
          filters: |
            code:
              - '**.php'
              - '**.js'
              - '**.css'
              - '**.json'
              - 'templates/**'
              - 'pwa/**'
              - 'readme.txt'
              - '.distignore'
              - 'phpcs.xml.dist'
              - '.github/workflows/**'

  phpcs:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/phpcs.yml

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/e2e.yml

  plugin-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/plugin-check.yml

  lint-js:
    needs: gate
    uses: ./.github/workflows/lint-js.yml

  # Spell-checks docs too, so it stays outside the code gate.
  typos:
    needs: gate
    uses: ./.github/workflows/typos.yml
