name: CI

on:
  push:
    branches: [ main ]
  # Unfiltered: `branches: [ main ]` would skip pull requests against another base.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # release-please's own pull request only touches the manifest, CHANGELOG.md
  # and the synced version strings, so the suite has nothing to tell it.
  gate:
    runs-on: ubuntu-24.04
    if: ${{ !startsWith(github.head_ref, 'release-please--') && !startsWith(github.ref, 'refs/heads/release-please--') }}
    steps:
      - run: true

  # Docs-only changes skip the wp-env jobs. `workflow_call` jobs cannot carry
  # `paths:` themselves, so the filter runs as its own job and gates the rest.
  changes:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**.php'
              - '**.js'
              - '**.css'
              - '**.json'
              - 'templates/**'
              - 'pwa/**'
              - 'readme.txt'
              - '.distignore'
              - 'phpcs.xml.dist'
              - '.github/workflows/**'

  phpcs:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/phpcs.yml

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/e2e.yml

  plugin-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/plugin-check.yml

  lint-js:
    needs: gate
    uses: ./.github/workflows/lint-js.yml

  # Spell-checks docs too, so it stays outside the code gate.
  typos:
    needs: gate
    uses: ./.github/workflows/typos.yml
