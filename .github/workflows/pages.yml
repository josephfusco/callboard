name: Pages

# Publishes site/ (the marketing page) with GitHub Pages. Enable Pages → Source: GitHub Actions once the repo is public.

on:
  workflow_dispatch: # switch to push-on-main once Pages is enabled for the repo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
