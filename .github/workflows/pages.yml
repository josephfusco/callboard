name: Pages

# Publishes the landing page with GitHub Pages (source "GitHub Actions"), and with it everything the live
# demo needs: callboard.zip built from main, blueprint.json, and the demo set's audio, all with URLs
# stamped by commit so caches never serve an old build. The page embeds WordPress Playground, which fetches those from the Pages origin.
# Runs on every push to main; the weekly run catches commits that do not start push workflows.

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1'

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - run: composer install --no-dev --no-interaction --optimize-autoloader --no-scripts
      - name: Build callboard.zip
        run: |
          set -euo pipefail
          mkdir -p build/callboard
          rsync -a --exclude-from='.distignore' --exclude='build' ./ build/callboard/
          (cd build && zip -qr callboard.zip callboard/)
          test -f build/callboard/callboard.php
          test -f build/callboard/vendor/autoload.php
          find build/callboard -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p out/demo
          cp -R site/. out/
          cp build/callboard.zip out/
          find tests/fixtures/callboard/demo-set -maxdepth 1 -type f ! -name 'cover-*' -exec cp {} out/demo/ \;
          # Pages caches for four hours. Stamp every asset URL with the commit so a deploy is always a new URL:
          # the page's images and its blueprint fetch, and the blueprint's zip and demo files.
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(src=\"[^\"?]+\.png)\"#\1?v=${V}\"#g; s#(content=\"https://josephfus.co/callboard/og\.png)\"#\1?v=${V}\"#; s#fetch\( 'blueprint\.json' \)#fetch( 'blueprint.json?v=${V}' )#" out/index.html
          jq --arg v "$V" '(.steps[] | (.pluginData?, .data?) | select(. != null and .resource? == "url") | .url) |= (. + "?v=" + $v)' blueprint.json > out/blueprint.json
          grep -c "?v=${V}" out/index.html out/blueprint.json
          ls -la out out/demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
