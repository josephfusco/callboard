name: Playground Main Build

# Builds callboard.zip from main and force-pushes it to the preview-main
# branch, which is what blueprint.json installs, so the README badge always
# boots current code.

on:
  push:
    branches: [main]
    paths-ignore: [ '**.md', '.github/**', 'tests/**' ]
  workflow_dispatch:

# Queued, not cancelled: the last push to finish is the one that wins.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - run: composer install --no-dev --no-interaction --optimize-autoloader --no-scripts
      - name: Build callboard.zip
        run: |
          set -euo pipefail
          mkdir -p build/callboard
          rsync -a --exclude-from='.distignore' --exclude='build' ./ build/callboard/
          (cd build && zip -qr callboard.zip callboard/)
      - name: Smoke-test the build
        run: |
          set -euo pipefail
          test -f build/callboard/callboard.php
          test -f build/callboard/vendor/autoload.php
          find build/callboard -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      - name: Publish to the preview-main branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Force-pushed from a throwaway repo so no zip reaches the history
          # everyone clones. The path is fixed because blueprint.json commits
          # to it; raw serves it with a five-minute cache.
          mkdir -p preview && cp build/callboard.zip preview/
          cd preview
          git init -q -b preview-main
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Playground build of ${SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" preview-main
