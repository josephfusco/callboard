name: Playground Preview Cleanup

# Deletes the per-PR preview branch when the pull request closes.
# pull_request_target so it also runs for fork pull requests; it never checks
# out pull request code.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, only deletes a branch ref
    types: [closed]

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/preview-pr-${PR_NUMBER}" --silent 2>/dev/null || true
