name: Playground Preview Publish

# Runs in the base-repo context so it can write even for fork pull requests.
# Downloads the build from the triggering "Playground Preview" run, pushes it
# to a per-PR preview-pr-N branch that raw.githubusercontent.com serves with
# CORS, and posts (or updates) a sticky comment with the Playground link. Every
# PR-derived input is validated; the blueprint comes from the base ref, only
# asset URLs are rewritten, and those always point at this repository.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] never checks out or executes pull request code
    workflows: ["Playground Preview"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download artifacts from the triggering run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const list = await github.rest.actions.listWorkflowRunArtifacts({ owner: context.repo.owner, repo: context.repo.repo, run_id: context.payload.workflow_run.id });
            for (const name of ['release-assets', 'pr-meta']) {
              const found = list.data.artifacts.find(a => a.name === name);
              if (!found) { core.setFailed(`Required artifact "${name}" not found.`); return; }
              const dl = await github.rest.actions.downloadArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: found.id, archive_format: 'zip' });
              fs.writeFileSync(`${name}.zip`, Buffer.from(dl.data));
            }
      - name: Unpack and validate artifacts
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TRUSTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-assets artifacts/pr-meta
          unzip -q -o -d artifacts/release-assets release-assets.zip
          unzip -q -o -d artifacts/pr-meta pr-meta.zip
          test -f artifacts/release-assets/callboard.zip
          META_HEAD_SHA=$(jq -r '.head_sha' artifacts/pr-meta/pr-meta.json)
          [[ "$META_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid SHA in pr-meta"; exit 1; }
          [[ "$META_HEAD_SHA" == "$TRUSTED_HEAD_SHA" ]] || { echo "pr-meta SHA does not match the triggering run"; exit 1; }
          readarray -t _prs < <(gh api "repos/${GH_REPO}/pulls?state=open&per_page=100" --paginate --jq '.[] | select(.head.sha == env.TRUSTED_HEAD_SHA) | .number')
          PR_NUMBER="${_prs[0]:-}"
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::notice::No open pull request at $TRUSTED_HEAD_SHA; nothing to publish."
            echo "skipped=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          { echo "pr_number=$PR_NUMBER"; echo "head_sha=$TRUSTED_HEAD_SHA"; } >> "$GITHUB_OUTPUT"
      - name: Publish preview assets
        if: steps.meta.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p "preview/${HEAD_SHA}" && cp artifacts/release-assets/callboard.zip "preview/${HEAD_SHA}/"
          cd preview
          git init -q -b "preview-pr-${PR_NUMBER}"
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Playground preview for PR #${PR_NUMBER} at ${HEAD_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "preview-pr-${PR_NUMBER}"
      - name: Assemble the Playground URL from the base-ref blueprint
        id: playground
        if: steps.meta.outputs.skipped != 'true'
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          set -euo pipefail
          PLUGIN_URL="https://raw.githubusercontent.com/${REPO}/preview-pr-${PR_NUMBER}/${HEAD_SHA}/callboard.zip"
          for _ in $(seq 30); do curl -sf -o /dev/null "$PLUGIN_URL" && break; sleep 2; done
          curl -sf -o /dev/null "$PLUGIN_URL" || { echo "Preview never appeared at $PLUGIN_URL"; exit 1; }
          BLUEPRINT=$(jq --arg plugin "$PLUGIN_URL" '.steps |= map(if .step == "installPlugin" and .pluginData.resource == "url" then .pluginData.url = $plugin else . end)' blueprint.json)
          echo "url=https://playground.wordpress.net/#$(printf '%s' "$BLUEPRINT" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Post or update the sticky comment
        if: steps.meta.outputs.skipped != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
          PLAYGROUND_URL: ${{ steps.playground.outputs.url }}
        with:
          script: |
            const marker = '<!-- callboard:playground-preview -->';
            const sha = process.env.HEAD_SHA;
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;
            const badge = 'https://img.shields.io/badge/Launch-3858E9?style=for-the-badge&logo=wordpress&logoColor=white';
            const body = [
              marker,
              '### 🛝 WordPress Playground',
              '',
              `Built from <a href="${commitUrl}"><samp>${sha.slice(0, 7)}</samp></a> · lands on the demo set, logged in as admin.`,
              '',
              `[![Launch this PR in WordPress Playground](${badge})](${process.env.PLAYGROUND_URL})`,
              '',
            ].join('\n');
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body });
