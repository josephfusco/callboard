name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a run in flight: this workflow tags and uploads release assets,
# and a cancelled run leaves a release half-finished. A superseded run costs a
# few minutes; a cancelled one costs a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # GITHUB_TOKEN can open the release pull request once "Allow GitHub
      # Actions to create and approve pull requests" is on for the repository,
      # but events it raises never start other workflows, so the release pull
      # request gets no CI and no Playground preview. Add a fine-grained PAT
      # with contents + pull-requests write as RELEASE_PLEASE_TOKEN to get both.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # release-please only updates the manifest and CHANGELOG.md. The plugin
  # header, the CALLBOARD_VERSION define, readme.txt's Stable tag and
  # package.json are synced by scripts/sync-versions.sh, the same script a
  # maintainer runs locally, so the CI behavior is grep-able.
  sync-versions:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: bash scripts/sync-versions.sh
      - name: Commit synced versions back to the release pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add callboard.php readme.txt package.json package-lock.json
            git commit -m "chore: sync version strings"
            gh auth setup-git
            git push
          fi

  # When the release pull request merges, release-please tags and cuts the
  # GitHub Release. Build the distribution zip and attach it.
  build-release-asset:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - run: composer install --no-dev --no-interaction --optimize-autoloader --no-scripts
      - name: Build callboard.zip
        run: |
          set -euo pipefail
          mkdir -p build/callboard
          rsync -a --exclude-from='.distignore' --exclude='build' ./ build/callboard/
          (cd build && zip -qr callboard.zip callboard/)
      - name: Smoke-test the build
        run: |
          set -euo pipefail
          test -f build/callboard/callboard.php
          test -f build/callboard/vendor/autoload.php
          find build/callboard -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload --clobber "$TAG_NAME" build/callboard.zip
