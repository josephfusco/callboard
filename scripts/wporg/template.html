<!doctype html>
<!--
	Layout for one wordpress.org screenshot: a headline and text, plus one or two phone captures or
	one browser capture.

	scripts/wporg-screenshots.js fills in the screenshot data and fonts, then saves this page at
	1200x750 with a device pixel ratio of 2 (2400x1500). Colors match site/index.html.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Poppins;font-weight:700;src:url("__FONT_BOLD__") format("truetype")}
@font-face{font-family:Poppins;font-weight:600;src:url("__FONT_SEMIBOLD__") format("truetype")}
:root{--bg:#eceae5;--ink:#1c1c1c;--ink-2:#6a6964;--accent:#e8541e;--warmth:rgba(214,184,150,.28);--bezel:#141414}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:750px;overflow:hidden}
body{position:relative;background-color:var(--bg);background-image:radial-gradient(90% 80% at 80% 20%,var(--warmth),transparent 65%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .1 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");background-size:auto,200px 200px;color:var(--ink);font-family:Poppins,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.copy{position:absolute;left:64px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center}
.copy h1{margin:0;font-weight:700;font-size:54px;line-height:1.04;letter-spacing:-.03em;text-wrap:balance}
.copy p{margin:22px 0 0;font-weight:600;font-size:21px;line-height:1.4;color:var(--ink-2);text-wrap:pretty;max-width:430px}
.dot{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--accent);right:78px;top:52px}

/* Phone frame: rounded bezel with a drop shadow. */
.phone{position:absolute;height:680px;aspect-ratio:390/844;padding:9px;border-radius:52px;background:var(--bezel);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 50px 90px -30px rgba(40,30,20,.45),0 20px 40px -20px rgba(40,30,20,.3)}
.phone img{display:block;width:100%;height:100%;border-radius:43px;object-fit:cover;object-position:top}
.one .phone.a{left:690px;top:35px}
.two .phone.a{left:620px;top:55px;height:640px}
.two .phone.b{left:840px;top:25px;height:680px;z-index:1}

.two .dot{display:none} /* hidden behind the front phone */

/* Browser frame: title bar over the capture. It extends past the bottom edge so the admin text stays
   readable. */
.wide .copy{width:340px}
.wide .copy h1{font-size:50px}
.wide .copy p{font-size:20px;max-width:340px}
.wide .dot{display:none}
.browser{position:absolute;left:440px;right:48px;top:52px;height:760px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 50px 90px -30px rgba(40,30,20,.45),0 20px 40px -20px rgba(40,30,20,.3)}
.browser .bar{height:34px;background:#e6e4df;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid #d3d1cb}
.browser .bar i{width:11px;height:11px;border-radius:50%;background:#cfccc5}
.browser img{display:block;width:100%}
</style>
</head>
<body>
<div class="copy"><h1 id="h"></h1><p id="p"></p></div>
<span class="dot" aria-hidden="true"></span>
<script>
	window.SHOT = __SHOT__;
	const s = window.SHOT;
	document.body.className = s.layout;
	document.getElementById( 'h' ).textContent = s.headline;
	document.getElementById( 'p' ).textContent = s.text;
	const add = ( html ) => document.body.insertAdjacentHTML( 'beforeend', html );
	if ( s.layout === 'wide' ) {
		add( '<div class="browser"><div class="bar"><i></i><i></i><i></i></div><img alt=""></div>' );
		document.querySelector( '.browser img' ).src = s.images[ 0 ];
	} else {
		s.images.forEach( ( src, i ) => {
			add( `<div class="phone ${ i ? 'b' : 'a' }"><img alt=""></div>` );
			document.querySelectorAll( '.phone img' )[ i ].src = src;
		} );
	}
</script>
</body>
</html>
